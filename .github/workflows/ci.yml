name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables shellcheck

      - name: Run repository selfcheck
        run: bash selfcheck.sh

      - name: Validate generated nftables ruleset
        run: |
          tmp_file="$(mktemp)"
          bash -lc 'source ./lib/common.sh; source ./modules/network_stack.sh; source ./modules/ssh_common.sh; source ./modules/firewall.sh; nftables_render_ruleset "$1" 34521 "2001:db8::1" "80,443" "53" "essential" "docker" "dual"' _ "$tmp_file"
          nft_output="$(nft -c -f "$tmp_file" 2>&1)" || {
            if printf '%s\n' "$nft_output" | grep -Eq 'Operation not permitted|cache initialization failed'; then
              printf '%s\n' "::warning::nftables syntax check skipped: nft lacks netlink permission"
            else
              printf '%s\n' "$nft_output"
              exit 1
            fi
          }
          rm -f "$tmp_file"

      - name: Run Debian container checks
        run: |
          docker run --rm \
            -e NI_RUN_SYSTEM_UPDATE=0 \
            -e NI_RUN_TOOLS=0 \
            -e NI_RUN_FIREWALL=0 \
            -e NI_RUN_FAIL2BAN=0 \
            -e NI_RUN_UNATTENDED=0 \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -w /repo \
            debian:12-slim \
            bash -lc 'bash selfcheck.sh && bash vps-init.sh --non-interactive --distro debian12 --lang en'

      - name: Run Ubuntu container checks
        run: |
          docker run --rm \
            -e NI_RUN_SYSTEM_UPDATE=0 \
            -e NI_RUN_TOOLS=0 \
            -e NI_RUN_FIREWALL=0 \
            -e NI_RUN_FAIL2BAN=0 \
            -e NI_RUN_UNATTENDED=0 \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -w /repo \
            ubuntu:24.04 \
            bash -lc 'bash selfcheck.sh && bash vps-init.sh --non-interactive --distro ubuntu24 --lang en'
